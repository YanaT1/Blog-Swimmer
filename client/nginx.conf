server {
    listen 3000;

    root /usr/share/nginx/html;
    index index.html;;

    location / {
        try_files $uri $uri/ /index.html =404;
    }

    location ~* \.(?:css|js|json|jpg|jpeg|png|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache_Control "public, must-revalidate";
    }

    include /etc/nginx/extra-conf.d/*.conf;
}
