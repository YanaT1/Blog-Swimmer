server {
    listen 80;
    server_name ivantryputen.com www.ivantryputen.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ivantryputen.com www.ivantryputen.com;

    ssl_certificate /etc/letsencrypt/live/ivantryputen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ivantryputen.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;


    location /api/ {
        proxy_pass http://backend:5000/; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    
    location ~* \.(?:css|js|json|jpg|jpeg|png|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, must-revalidate";
    }

    
    include /etc/nginx/extra-conf.d/*.conf;

    
    location / {
        try_files $uri /index.html;
    }
}