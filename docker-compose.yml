version: "3.9"

services:
  postgres:
    image: postgres:15
    restart: always
    env_file:
      - ./server/.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - appnet

  backend:
    build:
      context: ./server
    restart: always
    env_file:
      - ./server/.env    
    depends_on:
      - postgres
    expose:
      - "5000"              
    networks:
      - appnet

  frontend:
    build:
      context: ./client
    restart: always
    depends_on:
      - backend
    expose:
      - "3000"               
    networks:
      - appnet

  nginx-proxy:
    image: nginx:stable-alpine
    restart: always
    volumes:
      - ./docker/nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - appnet

volumes:
  postgres-data:

networks:
  appnet:
    driver: bridge
