services:
  postgres:
    image: postgres:15
    restart: always
    env_file:
      - ./server/.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - appnet

  backend:
    build:
      context: ./server
    restart: always
    env_file:
      - ./server/.env    
    depends_on:
      - postgres
    expose:
      - "5000"              
    networks:
      - appnet

  frontend:
    build: ./client
    restart: always
    ports:
      - "80:80" 
    depends_on:
      - backend
    networks:
      - appnet

volumes:
  postgres-data:

networks:
  appnet:
    driver: bridge
